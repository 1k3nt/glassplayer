name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject Spotify Client ID (optional repo variable SPOTIFY_CLIENT_ID)
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          if [ -n "$SPOTIFY_CLIENT_ID" ]; then
            perl -pi -e 's/SPOTIFY_CLIENT_ID_HERE/$ENV{SPOTIFY_CLIENT_ID}/' Sources/SpotifyAuth.swift
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project GlassPlayer.xcodeproj \
            -scheme GlassPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry GlassPlayer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-ipa
          path: GlassPlayer.ipa
