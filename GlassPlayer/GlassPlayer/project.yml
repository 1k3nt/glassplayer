name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: GlassPlayer/GlassPlayer
    steps:
      - uses: actions/checkout@v4

      - name: Check project folder
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -f GlassPlayer/GlassPlayer/project.yml ]; then
            echo "project.yml is NOT in GlassPlayer/GlassPlayer. Repo contents:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          echo "Found project.yml"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject Spotify Client ID (optional repo variable SPOTIFY_CLIENT_ID)
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          if [ -n "$SPOTIFY_CLIENT_ID" ]; then
            perl -pi -e 's/SPOTIFY_CLIENT_ID_HERE/$ENV{SPOTIFY_CLIENT_ID}/' Sources/SpotifyAuth.swift
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project GlassPlayer.xcodeproj \
            -scheme GlassPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry GlassPlayer.ipa
