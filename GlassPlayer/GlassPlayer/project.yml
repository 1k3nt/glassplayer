name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          FILE=$(find . -name project.yml -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "project.yml not found. Repo contents:"
            find . -not -path './.git/*' | head -n 60
            exit 1
          fi
          echo "Found $FILE"
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject Spotify Client ID (optional repo variable SPOTIFY_CLIENT_ID)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          if [ -n "$SPOTIFY_CLIENT_ID" ]; then
            perl -pi -e 's/SPOTIFY_CLIENT_ID_HERE/$ENV{SPOTIFY_CLIENT_ID}/' Sources/SpotifyAuth.swift
          fi

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild \
            -project GlassPlayer.xcodeproj \
            -scheme GlassPlayer \
            -configuration Release \
